<!doctype html>
<html lang="da" data-mode="dark" data-scheme="bandit" data-font="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12161F">
<title>BanditBoard Live</title>
<meta name="application-name" content="BanditBoard Live">
<meta name="apple-mobile-web-app-title" content="BanditBoard Live">
<meta name="description" content="BanditBoard Live – live scoreboard til billard, skomar og kegle billard">
<link rel="icon" id="favicon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F19;--panel:#141B2D;--panel2:#1B2440;--deep:#070A12;--line:#26304A;
  --text:#E8EEF7;--muted:#94A3B8;--ok:#22C55E;--danger:#EF4444;--warn:#F59E0B;
  --a1:#00D4AA;--a2:#FF6B35;--a3:#3B82F6;--on-a1:#04201A;
  --disp:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --body:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --score:var(--disp);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root[data-scheme="bandit"]{--a1:#FF5A1F;--a2:#00D4FF;--a3:#3B82F6;--on-a1:#12161F}
/* Arena Live (standard): kul-grå, blågrå kort, orange handling/valgt, cyan live/fremhævning. */
:root[data-scheme="bandit"]:not([data-mode="light"]){--bg:#12161F;--panel:#1A2332;--panel2:#1F2938;--deep:#0E1219;--line:#2A3547;--text:#E8E8E8;--muted:#A3AFBF;--ok:#3DDC84;--danger:#FF6B6B}
/* Lyst Arena: orange er for lyst som tekst på hvidt, så valgt-farven gøres mørkere. */
:root[data-scheme="bandit"][data-mode="light"]{--a1:#B23F12;--a2:#0077A3;--on-a1:#FFFFFF}
/* Den tidligere Bandit-navy kan stadig vælges. */
:root[data-scheme="navy"]{--a1:#19C3FF;--a2:#FF7A1A;--a3:#2F6BFF;--on-a1:#03121C}
:root[data-scheme="navy"]:not([data-mode="light"]){--bg:#070D1F;--panel:#0E1830;--panel2:#14223F;--deep:#050A17;--line:#1F3057}
:root[data-scheme="ember"]{--a1:#FF6B35;--a2:#F59E0B;--a3:#B91C1C;--on-a1:#1F0A02}
:root[data-scheme="neon"]{--a1:#7B61FF;--a2:#22D3EE;--a3:#E879F9;--on-a1:#FFFFFF}
:root[data-mode="light"]{--bg:#E9EEF6;--panel:#FFFFFF;--panel2:#F1F4FA;--deep:#FFFFFF;--line:#D3DAE6;--text:#0B0F19;--muted:#4B5A70}
:root[data-font="modern"]{--score:'Archivo',system-ui,sans-serif}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font:400 15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--disp);font-weight:800;letter-spacing:.005em;line-height:1.05}
h1{font-size:40px}h2{font-size:26px}h3{font-size:19px}
.mut{color:var(--muted)}
.sp{flex:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;height:60px;padding:0 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font:800 26px/1 var(--disp);letter-spacing:.01em}
.ball{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,var(--a1) 20%);box-shadow:0 0 14px color-mix(in srgb,var(--a1) 60%,transparent)}
.top nav{display:flex;gap:4px;margin-left:auto}
.nav{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600}
.nav.on{color:var(--text);background:var(--panel2)}
.nav.on svg{color:var(--a1)}
.bbmenu{position:relative;margin-left:auto;flex:none}
.menubtn{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font:700 15px var(--body);cursor:pointer}
.menubtn:hover,.menubtn[aria-expanded="true"]{border-color:var(--a1)}
.menubtn:focus-visible,.menulist .nav:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.menucur{color:var(--muted);font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menucur:before{content:'· '}
.top .menulist{position:absolute;right:0;top:calc(100% + 8px);z-index:40;display:block;margin:0;width:min(280px,calc(100vw - 16px));max-height:calc(100vh - 96px);max-height:calc(100dvh - 96px);overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--panel);box-shadow:0 18px 40px -12px rgba(0,0,0,.6)}
.top .menulist[hidden]{display:none}
.menulist ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.menulist .nav{width:100%;justify-content:flex-start;gap:12px;font-size:16px;text-align:left}
.menulist .nav.on{box-shadow:inset 3px 0 0 var(--a1)}
/* Sidenavnet skal altid kunne ses i rullelisten – også på mobil. */
.menulist .app-nav-label{display:inline;color:inherit;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.menulist .nav svg{flex:none}
@media (max-width:520px){.menucur{display:none}.menubtn{padding:0 12px}}
.venue{font:700 16px var(--disp);color:var(--muted);padding-left:6px}
@media (max-width:980px){.venue{display:none}}

.main{padding:16px;max-width:1800px;margin:0 auto}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-weight:600;white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sm{min-height:44px;padding:0 13px;font-size:14px}
.btn.pri{background:var(--a1);color:var(--on-a1);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.big{min-height:64px;font:800 24px var(--disp);width:100%}
.badge{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--a2);color:#1a0800;font-size:12px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{min-height:42px;border:0;background:none;color:var(--muted);padding:0 14px;border-radius:9px;font-weight:600}
.seg button.on{background:var(--a1);color:var(--on-a1)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:600;font-size:14px}
.chip b{font:800 20px var(--disp);color:var(--text)}
input[type=text],input:not([type]),input[type=number],textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
textarea{min-height:130px;resize:vertical}
input[type=number]{width:110px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.ch{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}

/* avatars */
.av{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none;background:var(--panel2)}
.av.lg{width:62px;height:62px;border-radius:14px}
.av.xl{width:96px;height:96px;border-radius:22px}
.ini{display:inline-grid;place-items:center;font:800 18px var(--disp);color:var(--a1);border:1px solid var(--line)}
.ini.lg{font-size:24px}.ini.xl{font-size:36px}

/* game */
.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.play{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;min-height:calc(100dvh - 170px)}
@media (max-width:980px){.play{grid-template-columns:1fr}}
.sides{display:grid;gap:14px;grid-template-columns:repeat(var(--c),minmax(0,1fr));align-content:stretch}
@media (max-width:700px){.sides{grid-template-columns:repeat(2,minmax(0,1fr))}}
.side{position:relative;display:flex;flex-direction:column;min-height:240px;padding:16px;border-radius:18px;background:var(--panel);border:2px solid var(--line);overflow:hidden;transition:border-color .2s}
.side.on{border-color:var(--a2);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--a2),0 0 26px -8px var(--a2)}50%{box-shadow:0 0 0 1px var(--a2),0 0 46px -4px var(--a2)}}
.side.won{border-color:var(--warn)}
.turn{position:absolute;top:12px;right:14px;display:flex;align-items:center;gap:7px;font-weight:800;font-size:14px;color:var(--a2)}
.turn::before,.dot{content:"";width:10px;height:10px;border-radius:50%;background:var(--a2);animation:pulse 1.2s ease-in-out infinite}
.won-tag{position:absolute;top:12px;right:14px;font-weight:800;color:var(--warn)}
@keyframes pulse{50%{opacity:.35;transform:scale(.8)}}
.who{display:flex;flex-direction:column;gap:10px}
.pl{display:flex;gap:12px;align-items:center;min-width:0}
.pl b{display:block;font:800 22px/1.05 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl small{display:block;color:var(--muted);font-size:13px}
.pl em{display:block;font-style:normal;font-weight:700;font-size:13px;color:var(--a2)}
.pl>div{min-width:0}
.lastr{margin-top:12px;min-height:34px;font:800 30px var(--disp);color:var(--a1)}
.lastr.n{color:var(--danger)}
.score{margin:auto 0;text-align:center;font-family:var(--score);font-weight:800;line-height:.88;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.sz2 .score{font-size:clamp(96px,13vw,240px)}
.sz4 .score{font-size:clamp(72px,8.5vw,160px)}
.szn .score{font-size:clamp(56px,6vw,112px)}
:root[data-font="modern"] .score{font-weight:900;letter-spacing:-.04em}
.bump{animation:bump .5s cubic-bezier(.2,.9,.3,1.35)}
@keyframes bump{0%{transform:scale(.82);color:var(--a2)}60%{color:var(--a2)}100%{transform:scale(1)}}
.meta{margin-top:10px;display:flex;gap:18px;color:var(--muted);font-weight:600;font-size:14px}
.meta b{font:800 20px var(--disp);color:var(--a1)}
.side.md{background:linear-gradient(180deg,var(--panel2),var(--panel))}
.mdh{display:flex;align-items:center;gap:10px}
.mdh .av{width:40px;height:40px;border-radius:50%}
.mdh b{font:800 24px var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mdh .dot{margin-left:auto}
.rds{display:flex;gap:6px;flex-wrap:wrap;min-height:30px}
.rds i{font-style:normal;font:700 17px var(--disp);padding:3px 8px;border-radius:7px;background:color-mix(in srgb,var(--a1) 14%,transparent);color:var(--a1)}
.rds i.n{background:color-mix(in srgb,var(--danger) 16%,transparent);color:var(--danger)}
.rds i.mut{background:none;color:var(--muted);font:500 13px var(--body)}

.pad{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:18px;background:var(--panel);border:1px solid var(--line);align-self:start;position:sticky;top:76px}
.modx{position:absolute;top:8px;right:8px;z-index:2;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--deep);color:var(--muted);font:700 20px/1 var(--disp)}
.total{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--deep);border:1px solid var(--line)}
.total span{color:var(--muted);font-weight:600}
.total strong{font:800 40px/1 var(--disp);color:var(--a1);min-width:48px}
.total small{margin-left:auto;color:var(--muted);font:700 16px var(--disp);text-align:right}
.entry{min-height:56px;padding:6px 14px;border-radius:12px;background:var(--deep);border:1px solid var(--line);font:800 38px/44px var(--disp)}
.entry.neg{color:#ff6b6b;border-color:color-mix(in srgb,var(--danger) 55%,var(--line))}.entry small{display:block;font:600 12px/1.3 var(--body);color:var(--muted)}
.kmrow{grid-template-columns:1fr 2fr}.kmrow .kminus{font-size:34px}.kmrow .kminus.on{background:var(--danger);color:#fff}
.kmrow .kent{background:var(--a1);color:var(--on-a1);border:0;font:800 24px var(--disp)}
.keys{display:grid;gap:8px}
.k4{grid-template-columns:repeat(4,1fr)}
.k3{grid-template-columns:repeat(3,1fr)}
.keys button{min-height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font:800 26px var(--disp);transition:transform .06s,background .15s}
.keys button:active{transform:scale(.94);background:color-mix(in srgb,var(--a1) 25%,var(--panel2))}
.keys .neg{background:color-mix(in srgb,var(--danger) 14%,var(--panel));color:var(--danger);border-color:color-mix(in srgb,var(--danger) 30%,var(--line))}
.keys .plus{background:color-mix(in srgb,var(--a1) 25%,var(--panel2));color:var(--a1)}
.next{min-height:76px;border:0;border-radius:14px;background:var(--a1);color:var(--on-a1);font:800 32px var(--disp);letter-spacing:.02em;box-shadow:0 8px 24px -10px var(--a1)}
.shotrow{display:grid;grid-template-columns:1fr 1.35fr;gap:8px}
.undoshot{min-height:76px;border-radius:14px;border:1px solid color-mix(in srgb,var(--danger) 50%,var(--line));background:color-mix(in srgb,var(--danger) 18%,var(--panel));color:#ff8d8d;font:800 20px var(--disp)}
.undoshot:active{transform:scale(.98)}
.desk{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:14px;align-items:start}
.desk.noside,.desk.nomain{grid-template-columns:1fr}
.desk.nomain .z-side{grid-column:1}
.zone{display:flex;flex-direction:column;gap:14px;min-width:0}
.z-top,.z-bottom{grid-column:1 / -1}
.z-main{grid-column:1}
.z-side{grid-column:2}
@media (max-width:980px){.desk,.desk.noside,.desk.nomain{grid-template-columns:1fr}.z-side,.z-main,.z-top,.z-bottom{grid-column:1}}
body.arrange .mod{position:relative;outline:2px dashed rgba(25,195,255,.75);outline-offset:4px;border-radius:16px;touch-action:none}
body.arrange .mod.lifting{outline-color:#fff;opacity:.72}
body.arrange .mod:before{content:attr(data-label);position:absolute;z-index:4;top:-12px;left:12px;background:var(--a1);color:var(--on-a1);font:800 12px/1.4 var(--disp);letter-spacing:.04em;padding:2px 8px;border-radius:8px}
.arrangebar{position:sticky;bottom:12px;z-index:40;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px;padding:12px;border-radius:16px;background:#07111c;border:1px solid rgba(25,195,255,.45);box-shadow:0 16px 40px -24px #000}
.arrangebar b{font:800 18px var(--disp)}
.arrangebar span{color:var(--muted);font-size:13px}
.next:active{transform:scale(.98)}
.padfoot{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.padfoot button{min-height:48px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-weight:600;font-size:14px}
.keys.k2{grid-template-columns:repeat(2,1fr)}
.rules button,.fouls button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:62px;line-height:1}
.rules button span,.fouls button span{font:600 13px var(--body);color:var(--muted)}
.rules button b{font:800 26px var(--disp);color:var(--a1)}
.rules button:last-child:nth-child(odd){grid-column:1/-1}
.keys.small button{min-height:48px;font-size:22px}
.fouls button{background:color-mix(in srgb,var(--danger) 14%,var(--panel));border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.fouls button b{font:800 20px var(--disp);color:var(--danger)}
.pl.shoot{padding:6px;margin:-6px;border-radius:14px;background:color-mix(in srgb,var(--a2) 14%,transparent)}
.rds i.g{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.lastr.g{color:var(--warn)}
.side.locked{opacity:.5;filter:saturate(.4)}
.bc.locked{opacity:.4}
.lock-tag{display:inline-block;margin-top:4px;padding:3px 9px;border-radius:8px;background:color-mix(in srgb,var(--a1) 18%,transparent);color:var(--a1);font:700 13px var(--body)}
.lock-tag.last{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.side>.lock-tag{position:absolute;top:12px;left:50%;transform:translateX(-50%);margin:0}
.lockbtn{position:absolute;bottom:12px;right:12px;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:600;font-size:13px;z-index:2}
.side.locked .lockbtn{opacity:1;filter:none}
.chip.lim{gap:4px;padding-right:4px}
.chip.lim button{min-width:40px;min-height:34px;border:0;border-radius:8px;background:var(--panel2);font:800 20px var(--disp)}
.chip.lim .limv{background:none;padding:0 4px}
.kbd{font-size:12px;color:var(--muted);text-align:center}

.winner{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:16px 20px;border-radius:18px;border:2px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,var(--panel))}
.winner span{display:block;color:var(--muted);font-weight:600}
.winner b{display:block;font:800 36px/1.05 var(--disp)}
.winner small{display:block;margin-top:4px;color:var(--a2);font-weight:700}
.wact{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}

/* big board */
.big{display:flex;flex-direction:column;gap:14px;height:100%;min-height:calc(100dvh - 170px)}
.bigtop{display:flex;align-items:center;gap:22px;padding:16px 22px;border-radius:20px;background:var(--panel);border:1px solid var(--line);flex-wrap:wrap}
.nx{display:flex;align-items:center;gap:18px;min-width:0}
.nx .av{border-radius:50%;box-shadow:0 0 0 4px var(--a1)}
.nx span,.rp span,.tb span{display:block;color:var(--muted);font-weight:600;font-size:15px}
.nx span{color:var(--a1)}
.nx b{display:block;font:800 clamp(34px,5vw,84px)/1 var(--disp)}
.rp{margin-left:auto;text-align:right}
.rp b{font:800 clamp(40px,5vw,88px)/1 var(--disp);color:var(--a1)}
.tb{padding-left:22px;border-left:1px solid var(--line);text-align:right}
.tb b{font:800 28px var(--disp)}
.resv{padding:10px 18px;border-radius:12px;background:color-mix(in srgb,var(--a2) 14%,var(--panel));color:var(--a2);font-weight:700}
.winbig{padding:12px 20px;border-radius:14px;border:2px solid var(--warn);font:800 36px var(--disp);color:var(--warn);text-align:center}
.bigcols{flex:1;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--deep)}
.bc{display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0}
.bc:last-child{border-right:0}
.bh{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-bottom:1px solid var(--line)}
.bh .av{border-radius:50%;width:54px;height:54px}
.bh b{font:800 clamp(20px,2.4vw,40px)/1 var(--disp);color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bn{flex:1;display:grid;place-items:center;font-family:var(--score);font-weight:800;font-size:clamp(70px,13vw,340px);line-height:1;color:var(--text);font-variant-numeric:tabular-nums}
.bc.on{background:color-mix(in srgb,var(--a1) 16%,var(--deep));box-shadow:inset 0 5px 0 var(--a1)}
.bc.on .bh b{color:var(--text)}
.bc.on .bn{color:var(--a1);text-shadow:0 0 50px color-mix(in srgb,var(--a1) 45%,transparent)}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:980px){.setup{grid-template-columns:1fr}}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}

/* v16 turneringsoversigt / match matrix */
.tmg{--line2:rgba(41,190,255,.28);display:grid;grid-template-columns:minmax(150px,1.55fr) 58px repeat(var(--nt),minmax(74px,1fr)) repeat(3,minmax(70px,.78fr)) minmax(92px,.9fr);grid-auto-rows:var(--rh);grid-template-rows:auto;
  background:linear-gradient(180deg,rgba(8,22,52,.92),rgba(4,12,32,.94));border:2px solid #1ea7ff;border-radius:14px;overflow:hidden;box-shadow:0 0 22px rgba(30,167,255,.35),inset 0 0 30px rgba(30,167,255,.08);color:#e6f4ff}

.rolechip{min-height:36px;padding:0 12px;border-radius:18px;border:1px solid var(--line);background:none;color:var(--muted);font-weight:700;font-size:13px}
.rolechip.on{background:var(--a2);color:#1a0800;border-color:transparent}
.net{padding:4px 10px;border-radius:12px;font-weight:700;font-size:12px}
.net.live{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.net.offline{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.pick.sm{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.qrbox{display:grid;place-items:center;margin:16px auto 8px;padding:14px;background:#fff;border-radius:16px;width:fit-content;min-width:120px;min-height:120px;color:#000}
.qrbox img{display:block}
.warn{margin-top:10px;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);font-weight:600;font-size:14px}
.tscroll{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:16px}
.rtable{width:100%;border-collapse:collapse;min-width:640px}
.rtable th,.rtable td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line)}
.rtable th{color:var(--muted);font-weight:600;font-size:13px;background:var(--panel)}
.rtable td:nth-child(2),.rtable th:nth-child(2){text-align:left}
.rtable td:first-child{font:800 20px var(--disp);color:var(--muted)}
.rtable td.p{color:var(--ok);font-weight:700}.rtable td.n{color:var(--danger);font-weight:700}
.rn{display:flex;align-items:center;gap:10px}.rn .av{width:36px;height:36px;border-radius:50%}
.rn small{display:block;color:var(--muted);font-size:12px}
.alist{margin-top:10px;border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.arow{display:grid;grid-template-columns:170px 120px 1fr 1fr;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
.arow time,.arow em{color:var(--muted);font-style:normal}
@media (max-width:700px){.arow{grid-template-columns:1fr 1fr}}
.sides.duo{grid-template-columns:repeat(2,minmax(0,1fr))}
.duo .side{padding:22px}
.duo .who{flex-direction:row;flex-wrap:wrap;gap:18px}
.duo .pl .av.lg{width:96px;height:96px;border-radius:18px}
.duo .pl b{font-size:30px}
.duo .score{font-size:clamp(120px,17vw,300px)}
.duo .lastr{font-size:42px}
.stand{flex:1;display:flex;flex-direction:column;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--deep)}
.srow{flex:1;display:grid;grid-template-columns:.5fr 4fr 1.6fr 1.4fr 1.8fr;align-items:center;gap:12px;padding:6px 22px;border-bottom:1px solid var(--line);min-height:56px}
.srow:last-child{border-bottom:0}
.srow.sh{flex:0 0 auto;min-height:0;padding:10px 22px;color:var(--muted);font-weight:600;font-size:14px}
.srow>span{min-width:0}
.srow.sh span:nth-child(n+3){text-align:right}
.sp1{font:800 clamp(24px,3.4vh,56px) var(--disp);color:var(--muted)}
.sn{display:flex;align-items:center;gap:14px}
.sn .av{width:clamp(36px,6vh,80px);height:clamp(36px,6vh,80px);border-radius:50%}
.sn b{font:800 clamp(24px,4.6vh,72px)/1 var(--disp);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spt{font:800 clamp(34px,7vh,120px)/1 var(--score);text-align:right;font-variant-numeric:tabular-nums}
.ssk{font:800 clamp(22px,4vh,60px) var(--disp);text-align:right;color:var(--muted)}
.ssk.p{color:var(--ok)}.ssk.n{color:var(--danger)}
.sst{font-weight:700;font-size:clamp(14px,2.2vh,30px);color:var(--muted);text-align:right}
.srow.on{background:color-mix(in srgb,var(--a1) 16%,var(--deep));box-shadow:inset 6px 0 0 var(--a1)}
.srow.on .spt,.srow.on .sst{color:var(--a1)}
.srow.locked{opacity:.5}
.tb small{display:block;color:var(--muted)}
body.phone .ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font:800 22px var(--disp)}
.phm{padding:16px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.phm .fld{margin-top:0}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 12px;border-radius:14px;background:var(--panel);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:600}
.prow small{display:block;color:var(--muted);font-weight:400}
a.btn{text-decoration:none}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal" class="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let KEY='cueboard.v1.boot';
let MODE=(location.hash||'').replace('#','');let TBL_ARG=null;{const mm=/^(tv|overlay|overlay-green)\/(\d+|alle)$/.exec(MODE);if(mm){MODE=mm[1];TBL_ARG=mm[2]}}
const defaults=()=>({players:[],teams:[],audit:[],signups:[],replay:null,game:null,history:[],lastSetup:null,reserve:[],settings:{operator:'',adminPin:'',tourName:'Klubaften',scheme:'bandit',mode:'dark',font:'classic',view:'classic',venue:'Min klub',table:'Bord 1',ovTitle:'Finale bord',ovSub:'Livestream',sponsors:['City Café','Global Transport','Dansk Sportsudstyr','Pro-Kø','Stream Services']}});
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r){const d=defaults();const o=Object.assign(d,r,{settings:Object.assign(d.settings,r.settings||{}),reserve:r.reserve||[],teams:r.teams||[],audit:r.audit||[],signups:r.signups||[]});const g=o.game;if(g){if(g.over===undefined)g.over=!!g.winner;g.reached=g.reached||[];g.rule=g.rule||{kegler:false};g.sides.forEach(x=>{x.feed=x.feed||[];x.cur=x.cur||0;x.sk=x.sk||{}})}return o}}catch(e){}return defaults()}
/* ================= FLERE BORDE =================
   S.tables = [{id,no,name,game,reserve,rev}]. S.game / S.reserve peger på enhedens aktuelle bord
   (valgt i appen, eller fra adressen: #tv/2, #overlay/2, #tv/alle). Hvert bord har sin egen kamp,
   aktiv spiller, runde, reservationer og sit eget OBS-overlay. */
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let curTid=null;
function curT(o){o=o||S;if(TBL_ARG!=null&&TBL_ARG!=='alle'){const x=o.tables.find(t=>t.no===+TBL_ARG);if(x)return x}let t=o.tables.find(x=>x.id===curTid);
 if(!t){t=(TBL_ARG!=null&&TBL_ARG!=='alle'&&o.tables.find(x=>x.no===+TBL_ARG))||o.tables.find(x=>x.id===lsGet('banditboard.table'))||o.tables[0];curTid=t.id}return t}
function migrateGame(g){if(!g)return g;if(g.over===undefined)g.over=!!g.winner;g.reached=g.reached||[];g.rule=g.rule||{kegler:false};(g.sides||[]).forEach(x=>{x.feed=x.feed||[];x.cur=x.cur||0;x.sk=x.sk||{}});return g}
function bindTables(o){
 if(!Array.isArray(o.tables)||!o.tables.length){const legacy=Object.getOwnPropertyDescriptor(o,'game');
  o.tables=[{id:'bord_1',no:1,name:(o.settings&&o.settings.table)||'Bord 1',game:legacy&&'value' in legacy?legacy.value||null:null,reserve:Array.isArray(o.reserve)?o.reserve:[],rev:1}]}
 delete o.game;delete o.reserve;
 o.tables.forEach((t,i)=>{if(!t.id)t.id='bord_'+(i+1);if(!t.no)t.no=i+1;if(!t.name)t.name='Bord '+t.no;if(!Array.isArray(t.reserve))t.reserve=[];if(t.game===undefined)t.game=null;migrateGame(t.game)});
 Object.defineProperty(o,'game',{get(){return curT(o).game},set(v){curT(o).game=v},enumerable:false,configurable:true});
 Object.defineProperty(o,'reserve',{get(){return curT(o).reserve},set(v){curT(o).reserve=v},enumerable:false,configurable:true});
 if(!Array.isArray(o.histDel))o.histDel=[];return o}
const tableName=()=>S&&S.tables?curT().name:'Bord 1';
const tStatus=t=>{const g=t.game;return !g?['Ledigt','idle']:g.over?['Slut','over']:g.paused?['Pause','pause']:['Live','live']};
function switchTable(id){if(!S.tables.some(t=>t.id===id))return;if(curTid!==id){setup.sel=[];setup.teams=[]}curTid=id;lsSet('banditboard.table',id);undo=[];prev={};adm=null;render()}
function tableBar(){return `<div class="tbar" role="tablist" aria-label="Borde">${S.tables.map(t=>{const g=t.game,[st,cl]=tStatus(t);
 return `<button class="tchip ${t.id===curT().id?'on':''}" data-act="bsel" data-v="${t.id}" role="tab" aria-selected="${t.id===curT().id}"><span class="tst ${cl}">${st}</span><b>${esc(t.name)}</b><small>${g?esc(g.sides.map(sideName).join(' – '))+' · '+g.sides.map(s=>s.score).join('–'):'Ingen kamp'}</small></button>`}).join('')}${isAdmin()&&S.tables.length<20?'<button class="tchip add" data-act="badd">+ Bord</button>':''}</div>`}
function tablesCard(){const base=baseURL();return `<section class="card"><h2>Borde</h2><p class="mut">Hvert bord har sin egen kamp, aktiv spiller, runde og sit eget TV og OBS-overlay. Brug linkene i OBS som browserkilde (1920×1080).</p>
<div class="btl">${S.tables.map(t=>{const[st,cl]=tStatus(t);return `<div class="btrow"><span class="tst ${cl}">${st}</span><input data-tname="${t.id}" value="${esc(t.name)}" aria-label="Navn på ${esc(t.name)}">
<code>#tv/${t.no}</code><code>#overlay/${t.no}</code><button class="btn sm" data-act="bqr" data-v="${t.no}">QR</button>${S.tables.length>1?`<button class="btn sm ghost danger" data-act="bdel" data-v="${t.id}" ${t.game&&!t.game.over?'disabled title="Afslut kampen først"':''}>Fjern</button>`:''}</div>`}).join('')}</div>
<div class="row" style="margin-top:10px">${S.tables.length<20?'<button class="btn" data-act="badd">+ Tilføj bord</button>':''}<button class="btn" data-act="win" data-v="tv/alle">Åbn "Alle borde" på TV</button></div>
<p class="mut" style="margin-top:8px">Fuld adresse: <b>${esc(base)}#overlay/1</b> osv. · Oversigt over alle borde: <b>${esc(base)}#tv/alle</b></p></section>`}
function allTablesView(){const st=S.settings;return `<div class="alltop">${brandMark('tv')}<b>${esc(st.tourName||st.venue)}</b><span>${esc(st.venue)}</span></div>
<div class="allgrid" style="--n:${Math.min(S.tables.length,S.tables.length>4?3:2)}">${S.tables.map(t=>{const g=t.game,[stx,cl]=tStatus(t);
 if(!g)return `<div class="allt idle"><div class="allh"><b>${esc(t.name)}</b><span class="tst ${cl}">${stx}</span></div><p class="mut">${t.reserve.length?'Reserveret: '+esc(t.reserve[0]):'Bordet er ledigt'}</p></div>`;
 const A=g.active||{};return `<div class="allt ${cl}"><div class="allh"><b>${esc(t.name)}</b><span class="tst ${cl}">${stx}</span><small>${g.mode==='dart'?'Dart · leg '+g.dart.legNo:sportName(g.mode).replace('Billard – ','')+' · runde '+(g.round||1)}</small></div>
 ${g.sides.map(s=>`<div class="allr ${!g.over&&A.teamId===s.id?'on':''} ${g.over&&g.winner===s.id?'won':''}"><span>${esc(sideName(s))}${!g.over&&A.teamId===s.id?(s.pids.length>1?`<i>● ${esc(P(A.playerId).first)}</i>`:'<i>● tur</i>'):''}</span><b>${s.score}</b></div>`).join('')}</div>`}).join('')}</div>`}
const lastSig={};
function bumpTableRevs(bump){if(!S||!S.tables)return;S.tables.forEach(t=>{const sig=JSON.stringify([t.game,t.reserve,t.name]);if(bump&&lastSig[t.id]!==undefined&&lastSig[t.id]!==sig)t.rev=(t.rev||0)+1;lastSig[t.id]=sig})}

let S=bindTables(defaults());
let bc=null;try{bc=new BroadcastChannel('cueboard')}catch(e){}
let applying=false,sock=null,net='lokal',srv=null,syncT=null;
function save(){if(S.game)syncActive(S.game);bumpTableRevs(!applying);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Kunne ikke gemme. Lageret er fuldt – fjern nogle fotos.')}if(bc)try{bc.postMessage('sync')}catch(e){} scheduleCloud();
const phoneMode=MODE==='mig'||MODE.startsWith('profil/');
if(sock&&sock.connected&&!applying&&!phoneMode&&(!MODE||srvCore)){if(myRole==='display'){if(lastCore){applying=true;applyCore(lastCore);applying=false;setTimeout(render,0)}toast('Denne enhed kan kun vise tavlen – brug en remote-kode for at styre');return}clearTimeout(syncT);syncT=setTimeout(()=>sock.emit('core',coreOf()),60)}}
let lastCore=null;
function coreOf(){const c=Object.assign({},S);delete c.audit;c.players=S.players.map(p=>Object.assign({},p,{photo:p.photo?1:''}));c.teams=S.teams.map(t=>Object.assign({},t,{photo:t.photo?1:''}));return c}
function pushImg(id,data){if(sock&&sock.connected)sock.emit('img',{id,data})}
function logA(action,obj,user){const e={id:uid()+uid(),at:Date.now(),user:user||S.settings.operator||'Ukendt',action,obj:obj||''};S.audit.push(e);if(sock&&sock.connected)sock.emit('audit',e)}

let menuOpen=false,tab='game',ptab='p',pq='',hf='all',editing=null,pendingYes=null,pendingNo=null,undo=[],prev={},arranging=false;
if({game:1,players:1,tour:1,matrix:1,rank:1,history:1,media:1,settings:1}[MODE]){tab=MODE;MODE=''}
let setup={sel:[],pairs:false,mode:'skomager',start:60,dir:'down',target:300,pind:true,elim:false,teams:[]};
if(S.lastSetup)setup=Object.assign({},setup,S.lastSetup,{sel:[],teams:[]});

/* helpers */
const P=id=>S.players.find(p=>p.id===id)||{id,first:'Ukendt',last:''};
const fullName=p=>((p.first||'')+' '+(p.last||'')).trim();
const initials=p=>(((p.first||'?')[0]||'')+((p.last||'')[0]||'')).toUpperCase();
const T=id=>S.teams.find(t=>t.id===id);
const sideName=s=>s?(s.teamId&&T(s.teamId)?T(s.teamId).name:s.pids.map(id=>P(id).first).join(' & ')):'';
const sideFull=s=>s?(s.teamId&&T(s.teamId)?T(s.teamId).name:s.pids.map(id=>fullName(P(id))).join(' & ')):'';
const side=(g,id)=>g.sides.find(s=>s.id===id);
const fmtDelta=v=>v>0?'+'+v:v<0?'−'+Math.abs(v):'0';
const avatar=(p,c='')=>p.photo?`<img class="av ${c}" src="${p.photo}" alt="">`:`<span class="av ini ${c}" aria-hidden="true">${esc(initials(p))}</span>`;
const tAvatar=(t,c='')=>t&&t.photo?`<img class="av ${c}" src="${t.photo}" alt="">`:`<span class="av ini ${c}" aria-hidden="true">${esc(((t&&t.name)||'?').replace(/^team\s+/i,'').slice(0,2).toUpperCase())}</span>`;
const skSide=s=>{const v=s.pids.map(p=>(s.sk||{})[p]||0);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):0};
const skChip=(s,pid)=>{const v=(s.sk||{})[pid]||0;if(!vis('sk'))return '';return v?`<span class="skv ${v<0?'n':'p'}">${fmtDelta(v)}</span>`:''};
const capMark=(s,pid)=>s.teamId&&T(s.teamId)&&T(s.teamId).captain===pid?'<span class="cap" title="Kaptajn">K</span>':'';
const innings=g=>Math.floor(g.sides.reduce((a,s)=>a+s.rounds.length,0)/g.sides.length)+1;
const pv=x=>typeof x==='number'?x:(x&&x.v)||0;
const ev=g=>{const n=Number(g.entry);return g.entry&&g.entry!=='-'&&!isNaN(n)?n:0};
const roundTotal=g=>g.pending.reduce((a,x)=>a+pv(x),0)+ev(g);
const shooter=s=>P(s.pids[(s.cur||0)%s.pids.length]);
const bump=s=>(prev[s.id]!==undefined&&prev[s.id]!==s.score)?'bump':'';
const kStats=(s,g)=>{const n=s.rounds.length;return `<span>Serie <b>${n?s.rounds[n-1]:0}</b></span><span>Snit <b>${n?(s.score/n).toFixed(1):'0.0'}</b></span><span>Mangler <b>${Math.max(0,g.target-s.score)}</b></span>`};
const I={game:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/>',players:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>',tour:'<path d="M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 14v4M8 21h8"/>',history:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',media:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',rank:'<path d="M6 20V10M12 20V4M18 20v-7"/>',matrix:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14.5h18M8.5 4v16M14 4v16"/>',settings:'<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2600)}
function openModal(h){$('#sheet').innerHTML=h;$('#modal').hidden=false}
function closeModal(){$('#modal').hidden=true;editing=null}
function ask(text,yesLabel,fn){pendingYes=fn;openModal(`<h2>${esc(text)}</h2><div class="mact"><span class="sp"></span><button class="btn" data-act="close">Annuller</button><button class="btn pri" data-act="yes">${esc(yesLabel)}</button></div>`)}
function applyTheme(){const d=document.documentElement.dataset,st=S.settings;d.scheme=st.scheme;d.mode=st.mode;d.font=st.font}

/* ---------- views ---------- */
function header(){const tabs=[['game','Spil'],['players','Kartotek'],['tour','Turneringer'],['matrix','Oversigt'],['rank','Rangliste'],['history','Historik'],['media','Medier'],['settings','Indstillinger']];
return `<header class="top"><div class="brand"><a href="/konto" class="brandhome" title="Til kontoen">${brandMark('hdr')}</a>${clubLogo()?`<img class="clublogo" src="${clubLogo()}" alt="Klublogo">`:''}</div><div class="bbmenu"><button type="button" class="menubtn" id="bbmenubtn" data-act="menu" aria-haspopup="true" aria-expanded="${menuOpen}" aria-controls="bbmenulist"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span><span class="menucur">${esc((tabs.find(t=>t[0]===tab)||[,''])[1])}</span></button><nav id="bbmenulist" class="menulist" aria-label="Sider"${menuOpen?'':' hidden'}><ul>${tabs.map(([k,l])=>`<li><button type="button" class="nav ${tab===k?'on':''}" data-act="tab" data-v="${k}"${tab===k?' aria-current="page"':''}>${ic(k)}<span class="app-nav-label">${l}</span></button></li>`).join('')}</ul></nav></div>${S.settings.adminPin?`<button class="rolechip ${adminOk?'on':''}" data-act="role">${adminOk?'Admin':'Scorekeeper'}</button>`:''}${net!=='lokal'?`<span class="net ${net}">${net==='live'?'Live':'Offline'}</span>`:''}<div class="venue">${esc(tableName())}</div></header>`}

/* Menu-knap med rulleliste i toppen. Åbn/luk ændrer kun DOM'en, så en kamp aldrig gen-tegnes. */
function syncMenu(){const b=document.getElementById('bbmenubtn'),l=document.getElementById('bbmenulist');if(b)b.setAttribute('aria-expanded',String(menuOpen));if(l)l.hidden=!menuOpen}
function setMenu(open,focus){menuOpen=open;syncMenu();if(focus==='btn')document.getElementById('bbmenubtn')?.focus();else if(focus==='item'){const l=document.getElementById('bbmenulist');(l?.querySelector('[aria-current="page"]')||l?.querySelector('button'))?.focus()}}
function sideTeams(){return setup.teams&&setup.teams.length?setup.teams.filter(id=>T(id)&&T(id).pids.length):null}
function groupSides(){const tm=sideTeams();if(tm)return tm.map(id=>T(id).pids.slice());const s=setup.sel;if(!setup.pairs)return s.map(x=>[x]);const o=[];for(let i=0;i<s.length;i+=2)o.push(s.slice(i,i+2));return o}

function viewSetup(){
  if(!S.players.length)return `<div class="empty"><h1>Ingen spillere endnu</h1><p>Opret spillere i kartoteket, eller hent seks demo-spillere og prøv en kamp med det samme.</p><div class="row"><button class="btn pri" data-act="demo">Hent demo-spillere</button><button class="btn" data-act="tab" data-v="players">Åbn kartotek</button></div></div>`;
  const sides=groupSides();
  const last=S.lastSetup?S.lastSetup.sel.filter(id=>S.players.some(p=>p.id===id)):[];
  const pm=setup.mode==='point';
  const k=setup.mode==='kegle';
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${String(setup[key])===String(v)?'on':''}" data-act="setp" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  return `<div class="setup">

function readLayout(){
  const order0=['boards','bar','turn','scores','pins','pad','hist'];
  const place0={boards:'top',bar:'top',turn:'top',scores:'main',pins:'side',pad:'side',hist:'side'};
  try{
    const s=JSON.parse(localStorage.getItem('banditboard.panels')||'null');
    if(s&&s.place){
      const place=Object.assign({},place0,s.place);
      let order=Array.isArray(s.order)?s.order.filter(id=>order0.includes(id)):[];
      if(!order.includes('pins')){const at=order.indexOf('pad');order.splice(at<0?order.length:at,0,'pins')}
      if(!order.includes('hist')){const at=order.indexOf('pad');order.splice(at<0?order.length:at+1,0,'hist')}
      order0.forEach(id=>{if(!order.includes(id))order.push(id)});
      return {place,order};
    }
  }catch(e){}
  return {place:place0,order:order0.slice()};
}
function writeLayout(L){try{localStorage.setItem('banditboard.panels',JSON.stringify(L))}catch(e){}}
function placePanel(id,place,clientY){
  const L=readLayout();
  L.place[id]=place;
  L.order=L.order.filter(x=>x!==id);
  const mates=[...document.querySelectorAll('.zone.z-'+place+' .mod')].filter(el=>el.dataset.mod!==id);
  let before=null;
  mates.forEach(el=>{const r=el.getBoundingClientRect();if(!before&&clientY<r.top+r.height/2)before=el.dataset.mod});
  const at=before?L.order.indexOf(before):L.order.length;
  L.order.splice(at<0?L.order.length:at,0,id);
  writeLayout(L);

const normName=s=>String(s||'').toLowerCase().replace(/\.(png|jpe?g|webp|svg|gif)$/,'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9æøå]+/g,'');

/* ================= TURNERINGSOVERSIGT / MATCH MATRIX =================
   Ingen separate data: kampprogram, runder, borde og timer ligger i S.tourney (central state),
   live-score læses fra bordenes kampe (S.tables) og afsluttede resultater fra historikken (S.history).
   Skæve, score, point og placering beregnes derfor altid ud fra de samme tal som resten af systemet. */
const TROUNDS=['Indledende runde','Ottendedelsfinale','Kvartfinale','Semifinale','Finale'];
const rng=n=>Array.from({length:Math.max(0,n|0)},(_,i)=>i+1);
function TO(){const t=S.tourney||(S.tourney={});
 if(!Array.isArray(t.matches))t.matches=[];
 if(!Array.isArray(t.rounds)||!t.rounds.length)t.rounds=TROUNDS.slice();
 if(!t.round||!t.rounds.includes(t.round))t.round=t.rounds[0];
 t.tables=Math.min(20,Math.max(1,Math.round(+t.tables)||10));
 t.feat=Math.min(t.tables,Math.max(1,Math.round(+t.feat)||1));
 t.pts=Object.assign({win:2,draw:1,loss:0},t.pts||{});
 t.rank=t.rank||'point';t.order=t.order||'name';t.scope=t.scope||'all';t.mode=t.mode||'point';
 if(t.target==null)t.target=0;if(!t.start)t.start=60;if(!(t.seq>=0))t.seq=t.matches.length;
 t.timer=Object.assign({label:'Næste kamp',dur:600000,left:600000,endAt:0,run:false},t.timer||{});
 t.place=t.place||{};return t}
const tabName=n=>{const t=S.tables.find(x=>x.no===+n);return t?t.name:'Bord '+n};
const mTeamName=id=>T(id)?T(id).name:'(slettet hold)';
const mName=m=>m.teams.map(mTeamName).join(' vs ');
const skNeg=o=>Object.values(o||{}).reduce((a,v)=>a+(+v<0?+v:0),0);
function mLive(m){for(const t of S.tables){const g=t.game;if(g&&!g.over&&g.matchId===m.id)return {t,g}}return null}
function mHist(m){return S.history.find(h=>h.matchId===m.id&&!h.aborted)||null}
function mRes(m){const L=mLive(m);
 if(L)return {st:'live',t:L.t,g:L.g,sides:L.g.sides.map(s=>({teamId:s.teamId,score:s.score,sk:skNeg(s.sk)}))};
 const h=mHist(m);if(h)return {st:'done',h,draw:!h.sides.some(x=>x.won),sides:h.sides.map(x=>({teamId:x.teamId,score:+x.score||0,sk:skNeg(x.sk),won:!!x.won}))};
 const r=m.manual;if(r){const sides=m.teams.map(id=>({teamId:id,score:+((r.s||{})[id])||0,sk:-Math.abs(+((r.k||{})[id])||0)}));let w=r.w;
  if(!w||w==='auto'){const mx=Math.max(...sides.map(x=>x.score)),top=sides.filter(x=>x.score===mx);w=top.length===1?top[0].teamId:'draw'}
  sides.forEach(x=>x.won=x.teamId===w);return {st:'done',manual:true,draw:w==='draw',sides}}
 return {st:'plan',sides:m.teams.map(id=>({teamId:id,score:0,sk:0}))}}
function tStats(){const to=TO(),st={},res={};S.teams.forEach(t=>st[t.id]={sk:0,score:0,pts:0,played:0,won:0,live:false,any:false,place:0});
 to.matches.forEach(m=>{const r=res[m.id]=mRes(m);if(r.st==='plan'||(to.scope==='round'&&m.round!==to.round))return;
  r.sides.forEach(x=>{const o=st[x.teamId];if(!o)return;o.any=true;o.sk+=x.sk;o.score+=x.score;if(r.st==='live'){o.live=true;return}
   o.played++;if(r.draw)o.pts+=+to.pts.draw||0;else if(x.won){o.pts+=+to.pts.win||0;o.won++}else o.pts+=+to.pts.loss||0})});
 const key=t=>{const o=st[t.id];return to.rank==='score'?[o.score,o.pts,o.sk]:[o.pts,o.score,o.sk]};
 const cmp=(a,b)=>{const A=key(a),B=key(b);for(let i=0;i<3;i++)if(B[i]!==A[i])return B[i]-A[i];return 0};
 const ranked=S.teams.filter(t=>st[t.id].any).sort(cmp);let p=0;ranked.forEach((t,i)=>{if(!i||cmp(ranked[i-1],t))p=i+1;st[t.id].place=p});
 S.teams.forEach(t=>{const o=+to.place[t.id];if(o){st[t.id].auto=st[t.id].place;st[t.id].place=o;st[t.id].manual=true}});
 return {st,res}}
function tRows(to,st,admin){const inT=new Set(to.matches.flatMap(m=>m.teams));
 const rows=S.teams.filter(t=>admin||!inT.size||inT.has(t.id));
 const byName=(a,b)=>a.name.localeCompare(b.name,'da',{numeric:true});
 return rows.sort(to.order==='place'?(a,b)=>(st[a.id].place||999)-(st[b.id].place||999)||byName(a,b):byName)}
function tCell(to,res,teamId,no){let best=null,rk=9;to.matches.forEach(m=>{if(m.round!==to.round||+m.table!==no||!m.teams.includes(teamId))return;const r=res[m.id],k=r.st==='live'?0:r.st==='plan'?1:2;if(k<rk){rk=k;best=m}});return best}
const tLiveNo=n=>{const t=S.tables.find(x=>x.no===n);return !!(t&&t.game&&!t.game.over)};
function cellHTML(to,res,teamId,no,admin){const m=tCell(to,res,teamId,no),feat=no===+to.feat?'feat':'';

 if(!m)return `<div class="tmc ${feat}"${click}></div>`;
 const r=res[m.id],me=r.sides.find(x=>x.teamId===teamId)||{score:0,sk:0},opp=m.teams.filter(id=>id!==teamId).map(mTeamName).join(' & ');
 if(r.st==='plan')return `<div class="tmc vs ${feat}"${click} title="${esc(mName(m))}"><b>VS</b><small>${esc(opp)}</small></div>`;
 const pts=r.st==='live'?0:r.draw?+to.pts.draw:me.won?+to.pts.win:+to.pts.loss;
 return `<div class="tmc ${r.st} ${feat} ${r.st==='done'&&me.won?'won':''}"${click} title="${esc(mName(m))}"><span class="l1">${r.st==='live'?'<i class="lv">● LIVE</i>':(pts>0?'+'+pts:pts)}</span><span class="l2">${me.score}</span><span class="l3 ${me.sk?'n':''}">${me.sk?fmtDelta(me.sk):'0'}</span></div>`}
const tPhoto=t=>t.photo&&String(t.photo).length>8?`<img src="${t.photo}" alt="">`:'';
function matrixHTML(admin,rh){const to=TO(),{st,res}=tStats(),N=to.tables,cols=rng(N),rows=tRows(to,st,admin);
 const head=`<div class="tmh corner">${admin?'Hold':''}</div><div class="tmh lab"></div>${cols.map(n=>`<div class="tmh bord ${n===+to.feat?'feat':''} ${tLiveNo(n)?'hl':''}"><span>${esc(tabName(n))}</span></div>`).join('')}<div class="tmh st"><span>Skæve</span></div><div class="tmh st"><span>Score</span></div><div class="tmh st"><span>Point</span></div><div class="tmh st"><span>Placering</span></div>`;
 const body=rows.map(t=>{const o=st[t.id];return `<div class="tmn ${o.live?'islive':''}"${admin?` data-act="mplace" data-v="${t.id}" title="Tryk for at låse placering"`:''}>${tPhoto(t)}<span>${esc(t.name)}</span></div><div class="tml"><span>Point</span><span>Score</span><span>Skæve</span></div>${cols.map(n=>cellHTML(to,res,t.id,n,admin)).join('')}<div class="tms sk">${o.any?(o.sk?fmtDelta(o.sk):'0'):''}</div><div class="tms">${o.any?o.score:''}</div><div class="tms pt">${o.any?o.pts:''}</div><div class="tms pl ${o.manual?'man':''}">${o.place?o.place+'.':o.any?'–':''}</div>`}).join('');
 return `<div class="tmg" style="--nt:${N};--rh:${rh}px">${head}${body||'<div class="tmempty">Ingen hold endnu – opret hold under Kartotek → Hold, eller importér spillere med en holdkolonne.</div>'}</div>`}

/* ---------- CENTRAL TIMER ----------
   Én timer i den centrale state (S.tourney.timer). Serverens ur er fælles tidsreference (srvOff),
   så admin, remote, TV og OBS viser præcis samme tid. Status: idle / running / paused / finished. */
let srvOff=0;
const nowMs=()=>Date.now()+srvOff;
const tLeft=tm=>tm.run?Math.max(0,tm.endAt-nowMs()):Math.max(0,+tm.left||0);
function tmState(tm){if(!tm)return 'idle';if(tm.run)return tLeft(tm)<=0?'finished':'running';if(tm.fin||(+tm.left<=0&&+tm.dur>0))return 'finished';return +tm.left<+tm.dur?'paused':'idle'}
const TM_LBL={idle:'Klar',running:'Kører',paused:'Pause',finished:'Tiden er udløbet'};
function fmtClock(ms){const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=v=>String(v).padStart(2,'0');return h?p(h)+':'+p(m)+':'+p(x):p(m)+':'+p(x)}
/* "10" = 10 min · "10:00" · "1:30:00" · "90 min" · "1 time og 30 minutter" · "1t 30m" · "45 sek" */
function parseDur(v){const t=String(v==null?'':v).trim().toLowerCase().replace(/\s+/g,' ');if(!t)return null;let s=null;
 const m=/^(\d{1,3})(?::(\d{1,2}))?(?::(\d{1,2}))?$/.exec(t);
 if(m){if(m[3]!=null){if(+m[2]>59||+m[3]>59)return null;s=(+m[1])*3600+(+m[2])*60+(+m[3])}else if(m[2]!=null){if(+m[2]>59)return null;s=(+m[1])*60+(+m[2])}else s=(+m[1])*60}
 else{const re=/(\d+(?:[.,]\d+)?)\s*(timer|time|t|h|minutter|minut|min|m|sekunder|sek|s)(?![a-zæøå])/g;let x,any=false,tot=0;
  while((x=re.exec(t))){any=true;const n=parseFloat(x[1].replace(',','.')),u=x[2];tot+=(u[0]==='t'||u==='h')?n*3600:u[0]==='m'?n*60:n}
  if(!any||t.replace(re,'').replace(/og|,|\s/g,'')!=='')return null;s=Math.round(tot)}
 if(!(s>0)||s>86400)return null;return s*1000}
const tmActive=()=>tmState(S.tourney&&S.tourney.timer)!=='idle';
const ovClock=()=>'';   // timeren vises nu i info-linjen (evInfo)
function tmStart(){const tm=TO().timer;if(tmState(tm)==='finished'||!(+tm.left>0))tm.left=tm.dur;const was=+tm.left<+tm.dur;tm.endAt=nowMs()+(+tm.left);tm.run=true;tm.fin=false;logA(was?'Fortsatte timer':'Startede timer',fmtClock(tm.left)+(tm.label?' · '+tm.label:''));save();render()}
function tmPause(){const tm=TO().timer;if(!tm.run)return;tm.left=tLeft(tm);tm.run=false;logA('Satte timer på pause',fmtClock(tm.left));save();render()}
function tmToggle(){TO().timer.run?tmPause():tmStart()}
function tmReset(){const tm=TO().timer;tm.run=false;tm.fin=false;tm.left=tm.dur;tm.endAt=0;logA('Nulstillede timer',fmtClock(tm.dur));save();render()}
function tmAdd(sec){const tm=TO().timer;if(tm.run)tm.endAt=Math.max(nowMs(),tm.endAt+sec*1000);else{tm.left=Math.max(0,(+tm.left||0)+sec*1000);if(tm.left>0)tm.fin=false}logA('Justerede timer',(sec>0?'+':'−')+Math.abs(sec/60)+' min → '+fmtClock(tLeft(tm)));save();render()}

 if(!S.tourney||!S.tourney.timer)return;const tm=S.tourney.timer,ms=tLeft(tm),st=tmState(tm),txt=fmtClock(ms);
 document.querySelectorAll('[data-clock]').forEach(e=>{if(e.textContent!==txt)e.textContent=txt;const b=e.closest('[data-tmbox],.tmclock,.tmclockc,.ovclock,.rclock');if(b)['idle','running','paused','finished'].forEach(c=>b.classList.toggle(c,c===st));if(b)b.classList.toggle('zero',st==='finished')});
 document.querySelectorAll('[data-tmst]').forEach(e=>{if(e.textContent!==TM_LBL[st])e.textContent=TM_LBL[st]});

function ensureTable(no){let t=S.tables.find(x=>x.no===no);if(t)return t;let id='bord_'+no;while(S.tables.some(x=>x.id===id))id+='x';t={id,no,name:'Bord '+no,game:null,reserve:[],rev:1};S.tables.push(t);S.tables.sort((a,b)=>a.no-b.no);return t}

 if(L){const d=ensureTable(no);if(d.game&&!d.game.over){toast(`${d.name} er optaget af en anden kamp`);render();return}
  d.game=L.t.game;L.t.game=null;if(curTid===L.t.id)curTid=d.id}
 else if(no)ensureTable(no);
 const old=m.table;m.table=no;logA('Flyttede kamp',`${mName(m)}: ${old?tabName(old):'intet bord'} → ${no?tabName(no):'intet bord'}`);toast(`${mName(m)} → ${no?tabName(no):'intet bord'}`);save();render()}

 curTid=t.id;lsSet('banditboard.table',t.id);undo=[];prev={};adm=null;const keep=tab;
 Object.assign(setup,{sport:'billard',mode:to.mode,teams:teams.slice(),sel:[],pairs:false,elim:false,pind:true,dir:'down',start:+to.start||60,target:+to.target||70,ptarget:to.mode==='point'?(+to.target||0):0,pstart:0});

 const keys=Object.keys(by).map(Number).sort((a,b)=>(a||99)-(b||99));
 const tables=keys.map(n=>`<div class="tmcard"><h3>${n?esc(tabName(n)):'Venter på bord'}</h3>${by[n].map(m=>{const r=res[m.id];return `<button class="tmcm ${r.st}" data-act="mopen" data-v="${m.id}"><em>${r.st==='live'?'● LIVE':r.st==='done'?'Slut':'VS'}</em>${r.sides.map(x=>`<span><i>${esc(mTeamName(x.teamId))}</i><b>${r.st==='plan'?'':x.score}</b></span>`).join('')}</button>`}).join('')}</div>`).join('')||'<p class="mut">Ingen kampe i runden endnu.</p>';
 const rank=S.teams.filter(t=>st[t.id].any).sort((a,b)=>st[a.id].place-st[b.id].place);
 return tables+(rank.length?`<div class="tmcard"><h3>Stilling</h3>${rank.map(t=>{const o=st[t.id];return `<div class="tmrk"><b>${o.place}.</b><span>${esc(t.name)}</span><em>${o.pts} P</em><small>${o.score} · ${o.sk?fmtDelta(o.sk):'0'} sk.</small></div>`}).join('')}</div>`:'')}

function syncFolderLooks(){if(!medier)return;const files=[];medier.forEach(sp=>['designs','sponsorboards'].forEach(c=>((sp.cats||{})[c]||[]).forEach(f=>files.push({sp:sp.name,c,f}))));
 const sig=files.map(x=>x.f.url).join('|');if(sig===folderSig)return;folderSig=sig;
 Promise.all(files.map(x=>fetch(x.f.url).then(r=>r.json()).then(j=>({x,j})).catch(()=>null))).then(list=>{const nd=[],nb=[];
  list.filter(Boolean).forEach(({x,j})=>{const cat=CAT_LBL[j.cat]?j.cat:(CAT_LBL[x.sp]?x.sp:'faelles'),id='dir:'+x.f.path;
   if(x.c==='designs'){const d=cleanDesign(j);if(d)nd.push(Object.assign(d,{id,cat,src:'Mappe',file:x.f.path}))}
   else{const b=cleanBoard(j);if(b)nb.push(Object.assign(b,{id,cat,src:'Mappe',file:x.f.path}))}});
  folderLooks={designs:nd,boards:nb};render()})}
function cleanDesign(j){if(!j||typeof j!=='object')return null;const tpl=TPL_LBL[j.tpl]?j.tpl:'classic',c={};DCOL.forEach(([k])=>{if(okHex(j.c&&j.c[k]))c[k]=j.c[k]});
 return {name:String(j.name||'Uden navn').slice(0,60),cat:CAT_LBL[j.cat]?j.cat:'faelles',tpl,c:Object.keys(c).length?Object.assign({},DC_KOBBER,c):null}}
function cleanBoard(j){if(!j||typeof j!=='object')return null;const names=(Array.isArray(j.names)?j.names:Array.isArray(j.sponsors)?j.sponsors:[]).map(x=>String(x).trim().slice(0,60)).filter(Boolean).slice(0,40);
 return {name:String(j.name||'Uden navn').slice(0,60),cat:CAT_LBL[j.cat]?j.cat:'faelles',style:BOARD_STYLES.some(([k])=>k===j.style)?j.style:'band',names,title:String(j.title||'').slice(0,40),sub:String(j.sub||'').slice(0,50)}}

 const list=Array.isArray(j)?j:j&&(j.designs||j.boards)?[...(j.designs||[]).map(x=>Object.assign({type:'banditboard-design'},x)),...(j.boards||[]).map(x=>Object.assign({type:'banditboard-sponsorboard'},x))]:[j];
 let nd=0,nb=0;const st=S.settings;st.designs=st.designs||[];st.boards=st.boards||[];
 list.forEach(x=>{if(!x)return;const isB=x.type==='banditboard-sponsorboard'||(!x.type&&(x.names||x.sponsors));
  if(isB){const b=cleanBoard(x);if(b){st.boards.push(Object.assign(b,{id:'b_'+uid()}));nb++}}else{const d=cleanDesign(x);if(d){if(!d.c&&d.tpl==='classic')d.c=Object.assign({},DC_KOBBER);st.designs.push(Object.assign(d,{id:'d_'+uid()}));nd++}}});

function dartboardSVG(style){const O=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5],neon=style==='neon';
 const Rr={b:6.4,ob:16,ti:99,to:107,di:162,dd:170,num:199,rim:226};
 const pt=(r,a)=>{const t=(a-90)*Math.PI/180;return (r*Math.cos(t)).toFixed(2)+' '+(r*Math.sin(t)).toFixed(2)};
 const sec=(r1,r2,a0,a1,f,st)=>`<path d="M${pt(r1,a0)}L${pt(r2,a0)}A${r2} ${r2} 0 0 1 ${pt(r2,a1)}L${pt(r1,a1)}A${r1} ${r1} 0 0 0 ${pt(r1,a0)}Z" fill="${f}"${st||''}/>`;
 let s='';
 if(!neon){const C={dark:'#1c1a17',light:'#efe1c1',red:'#c4122f',green:'#0b8a46',wire:'#b9b2a0'},W=` stroke="${C.wire}" stroke-width=".7"`;
  s+=`<circle r="${Rr.rim}" fill="#121110"/><circle r="${Rr.rim-3}" fill="none" stroke="#3a3530" stroke-width="3"/>`;
  O.forEach((n,i)=>{const a0=i*18-9,a1=i*18+9,dk=i%2===0;
   s+=sec(Rr.ob,Rr.ti,a0,a1,dk?C.dark:C.light,W)+sec(Rr.ti,Rr.to,a0,a1,dk?C.red:C.green,W)+sec(Rr.to,Rr.di,a0,a1,dk?C.dark:C.light,W)+sec(Rr.di,Rr.dd,a0,a1,dk?C.red:C.green,W)});
  s+=`<circle r="${Rr.ob}" fill="${C.green}" stroke="${C.wire}" stroke-width=".8"/><circle r="${Rr.b}" fill="${C.red}" stroke="${C.wire}" stroke-width=".8"/>`;

function ovModel(g){const A=g.active||{},onId=g.over?null:A.teamId,st=S.settings,D=g.mode==='dart';
 return {dart:D,title:st.ovTitle||'',sub:st.ovSub||'',tour:st.tourName||'',leg:D?g.dart.legNo:0,legsTo:D?g.dart.legsToWin:0,setsTo:D?g.dart.setsToWin:0,over:!!g.over,paused:!!g.paused,round:g.round||1,
  sides:g.sides.slice(0,2).map((s,i)=>{const isOn=s.id===onId,p=isOn?P(A.playerId):shooter(s),t=s.teamId&&T(s.teamId);let co='';
   if(D&&isOn&&s.score<=170&&s.score>1){const left=3-(g.dart.visit||[]).length;co=Dart501.isBogey(s.score)?'Bogey – kan ikke lukkes':(Dart501.checkout(s.score,left)||'')}
   return {label:t?t.name:(s.pids.length>1?sideName(s):(i?'Ude':'Hjemme')),name:p?fullName(p):sideName(s),team:t?t.name:(s.pids.length>1?sideName(s):''),club:(p&&p.club)||'',photo:p&&p.photo?p.photo:'',ini:initials(p||{first:sideName(s),last:''}),logo:t&&t.photo?t.photo:'',
    sets:s.dsets||0,legs:s.dlegs||0,score:s.score,avg:D?dAvg(s):'',on:isOn,won:!!(g.over&&g.winner===s.id),co}})}}
function ovBig(M,tpl,spon,ev){const a=M.sides[0],b=M.sides[1];
 const face=x=>x.photo?`<img src="${x.photo}" alt="">`:`<i>${esc(x.ini)}</i>`,lg=x=>x.logo?`<img class="bglogo" src="${x.logo}" alt="">`:'';
 const stats=x=>M.dart?`${M.setsTo?`<div><span>Sæt</span><b>${x.sets}</b></div>`:''}<div><span>Legs</span><b>${x.legs}</b></div><div class="sc"><span>Score</span><b>${x.score}</b></div>`:`<div class="sc"><span>Point</span><b>${x.score}</b></div>`;
 const tag=x=>x.won?'<em class="bgtag won">Vinder</em>':x.on?'<em class="bgtag">Kaster</em>':'';
 const info=M.over?'Kampen er slut':M.paused?'⏸ Pause':M.dart?`Leg ${M.leg}${M.legsTo?` · først til ${M.legsTo}${M.setsTo?' legs · '+M.setsTo+' sæt':''}`:''}`:`Runde ${M.round}`;
 const co=[a,b].map(x=>x.co?`<div class="bgco"><span>Checkout</span><b>${esc(x.co)}</b></div>`:'').join('');
 if(tpl==='neon'){const card=(x,r)=>`<div class="nc ${r?'r':'l'} ${x.on?'on':''} ${x.won?'won':''}"><div class="nch">${esc(x.label)}</div><div class="nct">${x.club||x.team?`${x.team?'Hold':'Klub'}: <b>${esc(x.team||x.club)}</b>`:'&nbsp;'}</div>
  <div class="ncp">${face(x)}${lg(x)}</div><div class="ncn">${esc(x.name)}</div>${tag(x)}
  <div class="ncs"><span>Score</span><b>${x.score}</b></div>
  ${M.dart?`<div class="ncl"><span>Leg:</span><b>L:${x.legs}</b></div>${M.setsTo?`<div class="ncl"><span>Sæt:</span><b>S:${x.sets}</b></div>`:''}<div class="ncl"><span>Snit:</span><b>${x.avg}</b></div>`:''}</div>`;
  return `<div class="ovwrap big tpl-neon">${ev}<div class="bg"><div class="nt">${esc(M.title||M.tour)}</div><div class="nb"><div class="nboard"></div>${co}<div class="ninfo">${esc(info)}</div></div>${card(a,0)}${card(b,1)}<div class="bgspon">${spon}</div></div></div>`}
 const card=(x,r)=>`<div class="cc ${r?'r':'l'} ${x.on?'on':''} ${x.won?'won':''}"><div class="cch">${esc(x.label)}</div>
 <div class="ccb"><div class="ccr"><span class="ccl">Spiller</span><div class="ccv">${r?'':`<span class="ccf">${face(x)}</span>`}<b>${esc(x.name)}</b>${r?`<span class="ccf">${face(x)}</span>`:''}</div></div>
 <div class="ccr"><span class="ccl">${x.team?'Hold':'Klub'}</span><div class="ccv">${r?lg(x):''}<b class="sm">${esc(x.team||x.club||'–')}</b>${r?'':lg(x)}</div></div>${tag(x)}</div>
 <div class="ccs">${stats(x)}</div></div>`;
 return `<div class="ovwrap big tpl-champ">${ev}<div class="bg"><div class="ct"><b>${esc(M.title||'Scoreboard')}</b><span>${esc(M.tour||M.sub)}</span></div><div class="cboard"></div>${card(a,0)}${card(b,1)}<div class="cinfo">${esc(info)}</div>${co?`<div class="cco">${co}</div>`:''}<div class="bgspon">${spon}</div></div></div>`}

function overlay(){const g=S.game,st=S.settings;
const board=activeBoard();
const picked=pickedSponsors();
const spon=picked.length?pickedStrip(picked,board):(board.id==='std'?sponBand():sponsorBoardHTML(board));
const cl=clubLogo(),bg=mediaUrl(M().band);
const bgStyle=bg?` style="background-image:linear-gradient(rgba(12,23,45,.55),rgba(12,23,45,.8)),url('${bg}');background-size:cover;background-position:center"`:'';
const mainAttr=` class="ovmain ${cl?'hasclub':''}"${bgStyle}`;
const club=cl?`<span class="ovclub"><img src="${cl}" alt=""></span>`:'';
if(!g||!g.sides.length)return `<div class="ovwrap ${ovTpl()}">${evInfo('ov')}<div${mainAttr}>${club}<div></div><div class="ovmid"><b>${esc(st.ovTitle)}</b><span>Næste kamp starter snart</span></div><div></div></div>${spon}</div>`;
const A=g.active||{},onId=g.over?null:A.teamId;
const roster=s=>s.pids.length<2?'':`<span class="ovroster">${s.pids.map((pid,i)=>{const a=s.id===onId&&A.playerId===pid;return `<i class="${a?'act':''}">${a?'● '+esc(P(pid).first)+' – din tur':esc(P(pid).first)}</i>`}).join('')}</span>`;
const scoreOf=s=>g.mode==='dart'?s.score:s.score;
if(g.sides.length>2){const round=g.mode==='dart'?'Leg '+g.dart.legNo:'Runde '+(g.round||1);

/* ---------- ret tal manuelt: +5, 5+, -3, 3-, eller 40 = sæt til 40 ---------- */
const minusOpp=()=>S.settings.minusMode!=='self';
/* Streng validering af manuelt indtastede point: kun hele tal, evt. med + eller - foran (fx -6, 6, +6). Afviser abc, --, - -, 6-, -abc. */
function wholeNum(str){const t=String(str==null?'':str).trim().replace(/[−–]/g,'-');return /^[+-]?\d{1,4}$/.test(t)?parseInt(t,10):null}
/* Minuspoint: den valgte side/spiller får minus (vises som skæve), alle modstandere får pointene */
function minusPoint(g,n,opt){const s=g.sides[g.turn];if(!s||!(n>0))return;giveSk(g,s,n,opt)}
function signedNum(str){const t=String(str||'').replace(/\s/g,'').replace(/[−–]/g,'-');const m=/^([+-]?)(\d+)([+-]?)$/.exec(t);if(!m||(m[1]&&m[3]))return null;const sg=m[1]||m[3];return {n:+m[2],sign:sg==='-'?-1:sg==='+'?1:0}}
function parseEdit(str,cur){if(!String(str||'').trim())return null;const r=signedNum(String(str).replace(/^=/,''));if(!r)return NaN;return r.sign?r.sign*r.n:r.n-cur}
function editModal(){const g=S.game;if(!g)return;openModal(`<h2>✎ Ret tal</h2><p class="mut">Skriv <b>+5</b> eller <b>5+</b> for at lægge til, <b>-3</b> eller <b>3-</b> for at trække fra – eller et tal uden fortegn (fx <b>40</b>) for at sætte scoren direkte. Tryk Enter for at udføre.</p>
<div class="edl">${g.sides.map(s=>`<label class="edr"><span><b>${esc(sideName(s))}</b><small>nu ${s.score}${s.place?' · 🔒 låst':''}</small></span><input data-edit="${s.id}" autocomplete="off" placeholder="fx +5" ${s.place?'disabled':''}><em data-edp="${s.id}"></em></label>`).join('')}</div>
<div class="mact"><button class="btn" data-act="close">Annullér</button><span class="sp"></span><button class="btn pri" data-act="editsave">Udfør</button></div>`);
 setTimeout(()=>{const s=g.sides[g.turn],i=$(`[data-edit="${s&&s.id}"]`);if(i)i.focus()},30)}
function editSave(){const g=S.game;if(!g)return;const ch=[];let bad=false;
 document.querySelectorAll('[data-edit]').forEach(i=>{const s=side(g,i.dataset.edit);if(!s)return;const d=parseEdit(i.value,s.score);if(d===null)return;if(isNaN(d)){bad=true;i.classList.add('err');return}if(d)ch.push([s,d])});
 if(bad)return toast('Forstår ikke tallet – skriv fx +5, 5- eller 40');if(!ch.length){closeModal();return}
 pushUndo();ch.forEach(([s,d])=>{const o=s.score;s.score=g.dir==='down'?Math.max(0,o+d):o+d;s.feed.push({t:'✎ '+fmtDelta(s.score-o),c:s.score<o?'n':''});
  plogAdd(g,s,s.score-o,o,s.score,{foul:true,manual:true});logA('Rettede tal manuelt',`${sideName(s)}: ${o} → ${s.score}`)});
 closeModal();settle(g,ch.map(x=>x[0]));toast(ch.length===1?`${sideName(ch[0][0])} har nu ${ch[0][0].score}`:'Tallene er rettet');save();render()}

/* ---------- nulstil hele tavlen ---------- */
function resetBoard(g){pushUndo();if(g.over)S.history=S.history.filter(h=>h.gid!==g.id);
 g.sides.forEach(s=>{s.score=g.startScore||0;s.rounds=[];s.feed=[];s.cur=0;s.sk={};s.pscore={};s.place=0});
 Object.assign(g,{placed:0,reached:[],pending:[],entry:'',turn:0,round:1,over:false,winner:null,loser:null,plog:[]});prev={};
 logA('Nulstillede tavlen',g.sides.map(sideName).join(', ')+' → '+(g.startScore||0));toast('Tavlen er nulstillet');save();render()}

/* ---------- når en side har fået point uden for sin egen tur (skæve / manuel) ---------- */
function gainDone(g,x){return g.mode==='point'?(g.target>0&&x.score>=g.target):g.mode==='kegle'?false:done(g,x)}
function settle(g,list){const hit=list.filter(x=>!x.place&&gainDone(g,x));if(!hit.length||g.over)return;
 if(g.elim){hit.forEach(x=>{if(!g.over&&!x.place)lockSide(g,x)});if(!g.over&&g.sides[g.turn].place)toActive(g);return}
 const best=[...hit].sort((a,b)=>g.dir==='down'?a.score-b.score:b.score-a.score)[0];endGame(g,best.id)}

/* ---------- skæve: den der laver skæve får minus, ALLE andre spillere får pointene ---------- */
function skTarget(g){return g.skSide&&side(g,g.skSide)?g.skSide:g.sides[g.turn].id}
function skBar(g){if(!vis('sk'))return '';const t=skTarget(g);
return `<div class="skbar"><div class="skhead"><span>Minuspoint / skæve – hvem lavede dem?</span><div class="skt">${g.sides.map(s=>`<button class="${s.id===t?'on':''}" data-act="sktgt" data-v="${s.id}">${esc(sideName(s))}</button>`).join('')}</div></div>
<div class="keys k4 skk">${[2,4,6,8,10,12,14,16].map(n=>`<button class="neg" data-act="sk" data-v="${n}">−${n}</button>`).join('')}</div>
<div class="skcustom pc1"><input id="skval" autocomplete="off" inputmode="text" enterkeyhint="done" placeholder="Skriv minuspoint, fx -6" aria-label="Manuelt minuspoint"><button class="pent" data-act="skc">Enter ↵</button><button class="undoshot" data-act="undo" style="min-height:52px;font-size:16px">Fortryd</button></div>
<small class="sknote">Skriv fx <b>-6</b> og tryk Enter: den valgte spiller får −6, og modstanderne får 6 point${g.dir==='down'?' (trækkes fra deres rest)':' (+6)'}. Fortryd med ✕ / Fortryd.</small></div>`}
function syncHistSk(g){if(!g||!g.over)return;const h=S.history.find(x=>x.gid===g.id);if(h)h.rev=(h.rev||0)+1;if(h)h.sides.forEach((sd,i)=>{if(g.sides[i]){sd.sk=Object.assign({},g.sides[i].sk||{});sd.score=g.sides[i].score}})}
function giveSk(g,off,n,opt){opt=opt||{};if(!off||!(n>0))return;if(!opt.noUndo)pushUndo();
 const pid=shooter(off).id,lbl=opt.manual?'Manuelt minuspoint':'Skæve';off.sk=off.sk||{};off.sk[pid]=(off.sk[pid]||0)-n;off.feed.push({t:(opt.manual?'−'+n+' minus':'×'+n+' skæve'),c:'n'});
 const grp=uid(),rec=g.sides.filter(x=>x.id!==off.id&&!x.place);
 g.plog=g.plog||[];plogAdd(g,off,0,off.score,off.score,{foul:true,grp,sk:-n,manual:!!opt.manual,playerId:pid,playerName:fullName(P(pid)),note:lbl+' '+fmtDelta(-n),skOff:{sid:off.id,pid,n}});
 rec.forEach((x,i)=>{const o=x.score;x.score=g.dir==='down'?Math.max(0,o-n):o+n;x.feed.push({t:(g.dir==='down'?'−':'+')+n+(opt.manual?' (manuelt)':' fra skæve'),c:'g'});
  plogAdd(g,x,x.score-o,o,x.score,{foul:true,grp,manual:!!opt.manual,note:lbl+' fra '+fullName(P(pid))})});
 logA(opt.manual?`Manuelt minuspoint: ${fullName(P(pid))} −${n}`:`Skæve: ${fullName(P(pid))} lavede ${n}`,`${n} point til ${rec.map(x=>`${sideName(x)} (${g.dir==='down'?x.score+n:x.score-n} → ${x.score})`).join(', ')||'ingen'}`);
 syncHistSk(g);settle(g,rec);
 if(!opt.noSave){toast(`${P(pid).first} −${n} skæve · +${n} til ${rec.length>1?'alle andre':rec.map(sideName).join('')}`);save();render()}}
// Manuelt minuspoint: kun hele negative tal (fx -6). Afviser tekst, 0, positive tal og fx "--", "- -", "6-", "-abc".
function skParse(v){const t=String(v==null?'':v).trim().replace(/[−–—]/g,'-');
 if(!t)return {err:'Skriv et minus-tal, fx -6'};
 if(!/^-?\d+$/.test(t))return {err:'Ugyldigt input – skriv et helt tal med minus foran, fx -6'};
 const n=parseInt(t,10);if(n===0)return {err:'0 point registreres ikke'};
 if(n>0)return {err:'Feltet er kun til minuspoint – skriv fx -'+n};
 if(n<-999)return {err:'Tallet er for stort'};
 return {n:-n}}
function addSk(g,n,opt){giveSk(g,side(g,skTarget(g)),Math.abs(n),opt)}
function undoGroup(g,grp){const es=(g.plog||[]).filter(x=>x.grp===grp&&!x.undone&&!x.undo);if(!es.length)return;pushUndo();
 if(g.over){g.over=false;g.winner=null;g.loser=null;S.history=S.history.filter(h=>h.gid!==g.id)}
 es.forEach(e=>{const s=side(g,e.sid);if(!s)return;e.undone=true;if(e.d){const old=s.score;s.score=old-e.d;s.feed.push({t:'Fortrudt '+fmtDelta(e.d),c:'n'});plogAdd(g,s,-e.d,old,s.score,{undo:true,foul:true});if(s.place&&!gainDone(g,s))unlockSide(g,s)}
  if(e.skOff){const o=side(g,e.skOff.sid);if(o){o.sk=o.sk||{};o.sk[e.skOff.pid]=(o.sk[e.skOff.pid]||0)+e.skOff.n;o.feed.push({t:'Skæve fortrudt',c:''})}}});
 logA('Fortrød skæve',es.map(e=>e.name).join(', '));toast('Skæve fortrudt');save();render()}
function saldo(pid){let n=0;S.history.forEach(h=>h.sides.forEach(sd=>{if(sd.sk&&sd.sk[pid])n+=sd.sk[pid]}));const g=S.game;if(g&&!g.over)g.sides.forEach(s=>{if(s.sk&&s.sk[pid])n+=s.sk[pid]});return n}

function keepTeamName(){const i=$('#t_name');if(i&&editing)editing.name=i.value}

/* ---------- rangliste ---------- */
let rk={per:'all',sport:'all',grp:'player'};
function rankRows(hsIn,grpIn){const grp=grpIn||rk.grp;const y0=new Date(new Date().getFullYear(),0,1).getTime(),tn=S.settings.tourName;
const hs=hsIn||S.history.filter(h=>!h.aborted&&(rk.per==='all'||(rk.per==='season'&&h.at>=y0)||(rk.per==='tour'&&h.tour===tn))&&(rk.sport==='all'||h.mode===rk.sport));
const m={};const row=(k,name,sub,av)=>m[k]||(m[k]={name,sub,av,n:0,w:0,l:0,sk:0});
hs.forEach(h=>h.sides.forEach(sd=>{const won=sd.won!==undefined?sd.won:(!!h.winner&&h.winner===(sd.names||[]).join(' & '));const ids=sd.pids||[],names=sd.names||[];
 if(grp==='team'){if(!sd.teamId)return;const t=T(sd.teamId),r=row('t:'+sd.teamId,t?t.name:(sd.team||'Slettet hold'),'',t?tAvatar(t):'');r.n++;if(won)r.w++;if(sd.last)r.l++;
   const v=ids.map(p=>(sd.sk||{})[p]||0);if(v.length)r.sk+=Math.round(v.reduce((a,b)=>a+b,0)/v.length);return}
 (ids.length?ids:names).forEach((x,i)=>{const p=ids.length?S.players.find(q=>q.id===x):null;let r;
  if(grp==='club'){const c=(p&&p.club)||'Uden klub';r=row('c:'+c,c,'','')}
  else r=row(ids.length?x:'n:'+x,p?fullName(p):(names[i]||x),(p&&p.club)||'',p?avatar(p):'');
  r.n++;if(won)r.w++;if(sd.last)r.l++;if(ids.length)r.sk+=(sd.sk||{})[x]||0})}));
return Object.values(m).sort((a,b)=>b.w-a.w||(b.w/b.n)-(a.w/a.n)||b.sk-a.sk)}
function viewRank(){const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${rk[k]===v?'on':''}" data-act="rk" data-k="${k}" data-v="${v}">${l}</button>`).join('')}</div>`;
const rows=rankRows();
return `<div class="phead"><h1>Rangliste</h1></div><div class="row">${seg('per',[['tour','Turnering'],['season','Sæson '+new Date().getFullYear()],['all','All-time']])}${seg('sport',[['all','Alle spil'],['skomager','Skomar'],['kegle','Kegle'],['point','Pointtavle'],['dart','Dart']])}${seg('grp',[['player','Spillere'],['club','Klubber'],['team','Hold']])}</div>
${rk.per==='tour'?`<p class="mut" style="margin-top:10px">Turnering: ${esc(S.settings.tourName)}</p>`:''}
<div class="tscroll"><table class="rtable"><thead><tr><th>#</th><th>Navn</th><th>Kampe</th><th>Sejre</th><th>Sidst</th><th>Sejr %</th><th>Skæve-saldo</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td><span class="rn">${r.av}<span><b>${esc(r.name)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:''}</span></span></td><td>${r.n}</td><td>${r.w}</td><td>${r.l}</td><td>${r.n?Math.round(r.w/r.n*100):0}%</td><td class="${r.sk<0?'n':r.sk>0?'p':''}">${fmtDelta(r.sk)}</td></tr>`).join('')||`<tr><td colspan="7" class="mut" style="text-align:left">Ingen afsluttede kampe i den periode endnu.</td></tr>`}</tbody></table></div>`}

async function playerJoinUrl(){

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC[(c^u[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zipStore(files){const enc=new TextEncoder(),parts=[],cd=[];let off=0;
const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;
files.forEach(f=>{const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data);
 const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
 parts.push(new Uint8Array(h.buffer),name,data);
 const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
 cd.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length});
const cdSize=cd.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
return new Blob(parts.concat(cd,[new Uint8Array(e.buffer)]),{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const xe=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
